name: Probe sources (temporary)

on:
  push:
    paths: ["probe/**.py", ".github/workflows/probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: raw
          key: raw-probe-${{ github.run_id }}
          restore-keys: raw-
      - run: python scripts/build.py > build.log 2>&1; tail -3 build.log; grep -n "stop data gaps\|stops:" build.log
      - run: python probe/sokcho.py
      - name: Commit the built data for a local check (temporary)
        run: |
          mkdir -p probe/data && cp site/data/stats.json site/data/pm.json site/data/beam.geojson probe/data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/data && git commit -m "probe data: built stats/pm (temporary)" && git push
