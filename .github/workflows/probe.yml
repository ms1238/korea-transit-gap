# temporary: PM parking zones per 지역 (with the zones that lack coordinates); removed afterwards
name: Probe PM sources
on:
  push:
    branches: ["claude/eloquent-gauss-g51l74"]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          GYEONGGI: ${{ secrets.GYEONGGI }}
        run: |
          mkdir -p raw
          python scripts/fetch.py pm_parking
          python - <<'PY'
          import json, collections
          p = json.load(open("raw/pm_parking.json"))["points"]
          c = collections.Counter(x["region"] for x in p)
          xy = collections.Counter(x["region"] for x in p if x["lon"] and x["lat"])
          print("PARKING", json.dumps({k: [v, xy[k]] for k, v in c.items()}, ensure_ascii=False))
          PY
