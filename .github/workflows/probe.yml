# temporary: run the new PM fetchers against the real APIs; removed before merging
name: Probe PM sources
on:
  push:
    branches: ["claude/eloquent-gauss-g51l74"]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          GYEONGGI: ${{ secrets.GYEONGGI }}
        run: |
          mkdir -p raw
          python scripts/fetch.py pm_fleet pm_parking pm_accidents
          python - <<'PY'
          import json, collections
          f = json.load(open("raw/pm_fleet.json"))["records"]
          by = collections.defaultdict(lambda: [0, set(), set()])
          for r in f:
              b = by[r["region"]]; b[0] += (r["kick"] or 0) + (r["bike"] or 0) + (r["total"] or 0); b[1].add(r["operator"] or "-"); b[2].add(r["date"])
          for k, v in sorted(by.items()): print("fleet", k, v[0], sorted(v[1])[:6], sorted(v[2]))
          p = json.load(open("raw/pm_parking.json"))["points"]
          print("parking", collections.Counter(x["region"] for x in p).most_common(60))
          print("parking dates", collections.Counter((x["source"], x["date"]) for x in p))
          PY
